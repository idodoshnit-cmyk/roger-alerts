name: SEC filings history (research only)

on:
  workflow_dispatch:
  # nightly schedule paused 2026-11-19: SEC needs a contact address in the User-Agent (waiting on the user)

concurrency:
  group: sec-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sec:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python news/sec_history.py
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/sec_filings.csv
          git commit -m "SEC filings history $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
